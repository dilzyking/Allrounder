<style>
*{
    margin:0;

    box-sizing:border-box;
}

body{
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:Arial,sans-serif;

    width:100%;

<body>

<div class="player-container">
    <video
        id="player"
        controls
        playsinline
        crossorigin
    ></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
const video = document.getElementById('player');

const streamUrl =
'https://falconstream.zee5.com/cmaf/live/2109037/NCL-M04-261026_ENG/master.m3u8?hdnts=st=1793026948~exp=1793028748~acl=/cmaf/live/2109037/NCL-M04-261026_ENG/master.m3u8*~id=0-1-6z51099398_10cb2182-a300-47d7-b9e6-fadee0b5ac7b~hmac=c3e20ee4cfb541fe009a57d20eac9614d0e3b75a703fe6be9c21fe2652c0658a&req_id=2956730f-b255-4244-afc5-9dc7a668c9e8';

const player = new Plyr(video, {
    controls: [
        'play-large',
        'play',
        'progress',
        'current-time',
        'mute',
        'volume',
        'settings',
        'pip',
        'airplay',
        'fullscreen'
    ],
    settings: ['speed'],
    speed: {
        selected: 1,
        options: [0.5, 0.75, 1, 1.25, 1.5, 2]
    }
});

if (Hls.isSupported()) {
    const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
    });

    hls.loadSource(streamUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(() => {});
    });

} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;
    video.addEventListener('loadedmetadata', function () {
        video.play().catch(() => {});
    });
}
</script>
